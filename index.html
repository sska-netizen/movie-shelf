<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>映画棚</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    padding: 0 20px 100px;
}

.search {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    margin-bottom: 18px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.tabs button {
    background: #333;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
}

.tabs button.active {
    background: white;
    color: black;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.movie {
    background: #1e1e1e;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
}

.info {
    padding: 11px;
}

.title {
    font-weight: bold;
    margin-bottom: 7px;
}

.status {
    font-size: 13px;
    color: #aaa;
}

.add {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: white;
    color: black;
    font-size: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
}

/* 詳細ページ */

#detailPage {
    display: none;
    min-height: 100vh;
    background: #111;
}

.detail-header {
    padding: 18px 20px;
    font-size: 18px;
}

.back {
    background: none;
    border: none;
    color: white;
    font-size: 17px;
}

.detail {
    padding: 10px 20px 50px;
}

.detail-poster {
    width: 55%;
    max-width: 260px;
    aspect-ratio: 2 / 3;
    background: #333;
    margin: 10px auto 25px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
}

.detail-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
}

.section {
    border-top: 1px solid #333;
    padding: 20px 0;
}

.section-title {
    font-size: 15px;
    color: #aaa;
    margin-bottom: 12px;
}

select,
textarea {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 16px;
    background: #222;
    color: white;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

.save {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
}

.delete {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #3a1717;
    color: #ff6b6b;
    font-size: 16px;
}

.note-display {
    white-space: pre-wrap;
    line-height: 1.7;
    color: #ddd;
}

.empty {
    color: #777;
    text-align: center;
    padding: 40px 0;
}
</style>
</head>

<body>

<!-- ホーム -->

<div id="homePage">

<header>🎬 映画棚</header>

<div class="container">

<input
    id="search"
    class="search"
    type="search"
    placeholder="映画を検索"
>

<div class="tabs">

<button class="active" onclick="setFilter('all', this)">
    すべて
</button>

<button onclick="setFilter('unwatched', this)">
    未視聴
</button>

<button onclick="setFilter('watched', this)">
    視聴済み
</button>

</div>

<div id="movieGrid" class="movie-grid"></div>

</div>

<button class="add" onclick="addMovie()">＋</button>

</div>


<!-- 詳細ページ -->

<div id="detailPage">

<div class="detail-header">

<button class="back" onclick="showHome()">
    ← 戻る
</button>

</div>

<div class="detail">

<div id="detailPoster" class="detail-poster">
    🎬
</div>

<div id="detailTitle" class="detail-title"></div>


<div class="section">

<div class="section-title">
    視聴状況
</div>

<select id="watchStatus" onchange="changeStatus()">

<option value="false">
    🔴 未視聴
</option>

<option value="true">
    🟢 視聴済み
</option>

</select>

</div>


<div class="section">

<div class="section-title">
    📝 メモ・感想
</div>

<div id="noteDisplay" class="note-display">
</div>

<button class="save" onclick="editNote()">
    メモを編集
</button>

</div>


<div class="section">

<button class="delete" onclick="deleteMovie()">
    この作品を削除
</button>

</div>

</div>

</div>


<script>

let movies = JSON.parse(
    localStorage.getItem("movies") || "[]"
);

let filter = "all";

let currentMovieIndex = null;


/* 保存 */

function saveMovies() {

    localStorage.setItem(
        "movies",
        JSON.stringify(movies)
    );

}


/* 映画追加 */

function addMovie() {

    const title = prompt(
        "映画のタイトルを入力してください"
    );

    if (!title || !title.trim()) {
        return;
    }

    const cleanTitle = title.trim();

    const exists = movies.some(movie =>
        movie.title.toLowerCase() ===
        cleanTitle.toLowerCase()
    );

    if (exists) {

        alert(
            "⚠️ この映画はすでに登録されています"
        );

        return;
    }

    movies.push({

        title: cleanTitle,

        watched: false,

        note: ""

    });

    saveMovies();

    render();

}


/* フィルター */

function setFilter(type, button) {

    filter = type;

    document
        .querySelectorAll(".tabs button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    render();

}


/* 一覧表示 */

function render() {

    const grid =
        document.getElementById("movieGrid");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    let list = movies.filter(movie => {

        const matchesSearch =
            movie.title
                .toLowerCase()
                .includes(search);

        const matchesFilter =
            filter === "all" ||

            (filter === "watched" &&
             movie.watched) ||

            (filter === "unwatched" &&
             !movie.watched);

        return matchesSearch &&
               matchesFilter;

    });


    if (list.length === 0) {

        grid.innerHTML =
            '<div class="empty">映画がありません</div>';

        return;

    }


    grid.innerHTML = list.map(movie => {

        const index =
            movies.indexOf(movie);

        return `

        <div
            class="movie"
            onclick="showDetail(${index})"
        >

            <div class="poster">
                🎬
            </div>

            <div class="info">

                <div class="title">
                    ${escapeHTML(movie.title)}
                </div>

                <div class="status">

                    ${
                        movie.watched
                        ? "🟢 視聴済み"
                        : "🔴 未視聴"
                    }

                </div>

            </div>

        </div>

        `;

    }).join("");

}


/* 詳細ページ */

function showDetail(index) {

    currentMovieIndex = index;

    const movie = movies[index];

    document
        .getElementById("homePage")
        .style.display = "none";

    document
        .getElementById("detailPage")
        .style.display = "block";


    document
        .getElementById("detailTitle")
        .textContent = movie.title;


    document
        .getElementById("watchStatus")
        .value = movie.watched;


    document
        .getElementById("noteDisplay")
        .textContent =
            movie.note ||
            "まだメモはありません。";


    window.scrollTo(0, 0);

}


/* ホームに戻る */

function showHome() {

    document
        .getElementById("detailPage")
        .style.display = "none";

    document
        .getElementById("homePage")
        .style.display = "block";

    render();

}


/* 視聴状態変更 */

function changeStatus() {

    const movie =
        movies[currentMovieIndex];

    movie.watched =
        document
            .getElementById("watchStatus")
            .value === "true";

    saveMovies();

}


/* メモ編集 */

function editNote() {

    const movie =
        movies[currentMovieIndex];

    const note = prompt(
        "メモ・感想を入力してください",
        movie.note || ""
    );

    if (note === null) {
        return;
    }

    movie.note = note;

    saveMovies();

    document
        .getElementById("noteDisplay")
        .textContent =
            movie.note ||
            "まだメモはありません。";

}


/* 削除 */

function deleteMovie() {

    const movie =
        movies[currentMovieIndex];

    if (
        !confirm(
            "「" +
            movie.title +
            "」を削除しますか？"
        )
    ) {
        return;
    }

    movies.splice(
        currentMovieIndex,
        1
    );

    saveMovies();

    currentMovieIndex = null;

    showHome();

}


/* 検索 */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* HTML対策 */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


render();

</script>

</body>
</html>
