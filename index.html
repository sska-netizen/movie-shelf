<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>映画棚</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    padding: 0 20px 100px;
}

.search {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tabs button {
    background: #333;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
}

.tabs button.active {
    background: white;
    color: black;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.movie {
    background: #1e1e1e;
    border-radius: 12px;
    overflow: hidden;
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

.info {
    padding: 10px;
}

.title {
    font-weight: bold;
    margin-bottom: 6px;
}

.status {
    font-size: 13px;
    color: #aaa;
}

.add {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: white;
    color: black;
    font-size: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

.empty {
    color: #777;
    text-align: center;
    padding: 40px 0;
}
</style>
</head>

<body>

<header>🎬 映画棚</header>

<div class="container">

<input
    id="search"
    class="search"
    type="search"
    placeholder="映画を検索"
>

<div class="tabs">
    <button class="active" onclick="setFilter('all', this)">すべて</button>
    <button onclick="setFilter('unwatched', this)">未視聴</button>
    <button onclick="setFilter('watched', this)">視聴済み</button>
</div>

<div id="movieGrid" class="movie-grid"></div>

</div>

<button class="add" onclick="addMovie()">＋</button>

<script>

let movies = JSON.parse(localStorage.getItem("movies") || "[]");
let filter = "all";

function saveMovies() {
    localStorage.setItem("movies", JSON.stringify(movies));
}

function addMovie() {

    const title = prompt("映画のタイトルを入力してください");

    if (!title || !title.trim()) {
        return;
    }

    const cleanTitle = title.trim();

    const exists = movies.some(movie =>
        movie.title.toLowerCase() === cleanTitle.toLowerCase()
    );

    if (exists) {
        alert("⚠️ この映画はすでに登録されています");
        return;
    }

    movies.push({
        title: cleanTitle,
        watched: false,
        note: ""
    });

    saveMovies();
    render();
}

function setFilter(type, button) {

    filter = type;

    document.querySelectorAll(".tabs button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    render();
}

function render() {

    const grid = document.getElementById("movieGrid");
    const search = document.getElementById("search").value.toLowerCase();

    let list = movies.filter(movie => {

        const matchesSearch =
            movie.title.toLowerCase().includes(search);

        const matchesFilter =
            filter === "all" ||
            (filter === "watched" && movie.watched) ||
            (filter === "unwatched" && !movie.watched);

        return matchesSearch && matchesFilter;
    });

    if (list.length === 0) {

        grid.innerHTML =
            '<div class="empty">映画がありません</div>';

        return;
    }

    grid.innerHTML = list.map((movie, index) => `

        <div class="movie" onclick="movieMenu(${movies.indexOf(movie)})">

            <div class="poster">🎬</div>

            <div class="info">

                <div class="title">
                    ${escapeHTML(movie.title)}
                </div>

                <div class="status">
                    ${movie.watched ? "🟢 視聴済み" : "🔴 未視聴"}
                </div>

            </div>

        </div>

    `).join("");
}

function movieMenu(index) {

    const movie = movies[index];

    const action = prompt(
        movie.title +
        "\n\n1：視聴済みにする\n2：メモを書く\n3：削除\n\n番号を入力してください"
    );

    if (action === "1") {

        movie.watched = !movie.watched;

        saveMovies();
        render();

    } else if (action === "2") {

        const note = prompt(
            "メモ・感想を入力してください",
            movie.note || ""
        );

        if (note !== null) {
            movie.note = note;
            saveMovies();
        }

    } else if (action === "3") {

        if (confirm("「" + movie.title + "」を削除しますか？")) {

            movies.splice(index, 1);

            saveMovies();
            render();
        }
    }
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document
    .getElementById("search")
    .addEventListener("input", render);

render();

</script>

</body>
</html>
