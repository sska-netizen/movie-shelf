<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Shelf</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#f4eee8;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 35%),
    linear-gradient(90deg,rgba(0,0,0,.25),transparent 20%,transparent 80%,rgba(0,0,0,.25)),
    #211a17;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(25,19,16,.97);
  border-bottom:1px solid rgba(255,255,255,.1);
  box-shadow:0 5px 20px rgba(0,0,0,.45);
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:15px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h1{
  margin:0;
  font-size:22px;
}

button{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
}

.add-button,
.primary,
.load-more{
  background:linear-gradient(145deg,#f1d6a5,#b78a50);
  color:#241a12;
  font-weight:800;
}

.add-button{
  border-radius:999px;
  padding:10px 14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 50px;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.search-box input{
  flex:1;
  min-width:0;
  padding:13px 14px;
  border:0;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

.search-box button{
  background:#f0e1cc;
  color:#251b16;
  font-weight:700;
}

.result-item{
  display:flex;
  gap:12px;
  padding:10px;
  margin-bottom:8px;
  background:linear-gradient(145deg,#fff,#eee);
  color:#111;
  border-radius:12px;
  cursor:pointer;
  align-items:center;
  box-shadow:0 3px 12px rgba(0,0,0,.3);
}

.result-item img{
  width:55px;
  height:82px;
  object-fit:cover;
  border-radius:5px;
  background:#ddd;
}

.result-title{
  font-weight:800;
}

.result-year{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.section-title{
  margin:20px 0 14px;
  font-size:20px;
}

/* SHELF TABS */

.shelf-tabs{
  display:flex;
  gap:7px;
  margin:0 0 12px;
}

.shelf-tab{
  flex:1;
  padding:11px 5px;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  color:#d8cec4;
  font-weight:800;
}

.shelf-tab.active{
  background:linear-gradient(145deg,#f1d6a5,#b78a50);
  color:#241a12;
}

/* MOVIE GRID */

.movie-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px 10px;
  padding:18px 6px 35px;
}

.movie-card{
  background:linear-gradient(145deg,#0d0b0a,#332821);
  padding:7px;
  border-radius:4px;
  cursor:pointer;
  box-shadow:
    0 10px 18px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.08),
    inset 0 0 0 3px rgba(0,0,0,.7);
  transition:transform .15s ease;
}

.movie-card:active{
  transform:scale(.97);
}

.movie-card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#111;
  border:2px solid rgba(214,174,112,.55);
}

.movie-info{
  padding:8px 3px 4px;
}

.movie-title{
  font-size:13px;
  font-weight:800;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movie-year{
  color:#bcae9f;
  font-size:11px;
  margin-top:3px;
}

.status{
  display:inline-block;
  margin-top:6px;
  padding:3px 7px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}

.watched{
  background:rgba(112,184,118,.22);
  color:#a9e3ae;
}

.unwatched{
  background:rgba(255,255,255,.12);
  color:#d8cec4;
}

/* LOAD MORE */

.load-more{
  display:block;
  width:100%;
  margin:15px auto 25px;
}

.load-more:disabled{
  opacity:.6;
}

/* DETAIL */

.detail{
  background:linear-gradient(145deg,#302621,#171210);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.detail-top{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:20px;
  padding:20px;
}

.detail-poster{
  width:100%;
  border-radius:5px;
  border:3px solid #9c7445;
}

.detail-title{
  font-size:27px;
  font-weight:900;
  line-height:1.2;
  margin-bottom:8px;
}

.detail-original{
  color:#b8aaa0;
  margin-bottom:14px;
}

.detail-overview{
  line-height:1.75;
  color:#e3d8cf;
}

.detail-section{
  border-top:1px solid rgba(255,255,255,.08);
  padding:18px 20px;
}

.detail-section h3{
  margin-top:0;
  color:#f1d6a5;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.field select,
.field textarea{
  width:100%;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#f5f5f5;
  color:#222;
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.rating{
  font-size:27px;
  letter-spacing:3px;
}

.rating span{
  color:#665e57;
  cursor:pointer;
}

.rating span.active{
  color:#e6ad4c;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.secondary{
  background:rgba(255,255,255,.12);
  color:#eee;
}

.danger{
  background:#a83232;
  color:white;
}

.back{
  margin-bottom:14px;
}

.empty,
.loading{
  text-align:center;
  padding:35px 10px;
  color:#b9aca2;
}

.error{
  background:rgba(180,40,40,.2);
  color:#ffb4b4;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

.tmdb-credit{
  margin-top:30px;
  font-size:11px;
  color:#8e8279;
  text-align:center;
}

.list-search{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  margin-bottom:10px;
}

/* COUNT */

.shelf-count{
  text-align:center;
  color:#bcae9f;
  font-size:12px;
  margin-top:2px;
  margin-bottom:3px;
}

/* MOBILE */

@media(max-width:650px){

  .container{
    padding:15px 8px 45px;
  }

  .movie-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px 7px;
    padding:14px 3px 30px;
  }

  .movie-card{
    padding:5px;
  }

  .movie-title{
    font-size:11px;
  }

  .movie-year{
    font-size:10px;
  }

  .status{
    font-size:9px;
    padding:3px 5px;
  }

  .detail-top{
    grid-template-columns:115px 1fr;
    gap:14px;
    padding:15px;
  }

  .detail-title{
    font-size:20px;
  }

  .detail-section{
    padding:15px;
  }

  .shelf-tab{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <h1>🎬 Movie Shelf</h1>

    <button
      class="add-button"
      onclick="focusSearch()"
    >
      ＋ 追加
    </button>

  </div>

</header>

<main
  class="container"
  id="app"
></main>

<script>

const API_BASE =
  "https://movie-shelf-api.sska9927.workers.dev";

const STORAGE_KEY =
  "movieShelfV4";

let movies =
  loadMovies();

let currentQuery =
  "";

let currentPage =
  1;

let hasNextPage =
  false;

let searching =
  false;

let currentShelfTab =
  "all";


/* STORAGE */

function loadMovies(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  }catch{

    return [];

  }

}

function saveMovies(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(movies)
  );

}


/* SECURITY */

function escapeHTML(text){

  if(!text) return "";

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* HELPERS */

function poster(url){

  return url ||
    "https://via.placeholder.com/500x750?text=No+Poster";

}

function year(date){

  return date
    ? date.substring(0,4)
    : "";

}


/* HOME */

function showHome(){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div id="searchArea">

      <div class="search-box">

        <input
          id="movieSearch"
          placeholder="映画を検索..."
          onkeydown="
            if(event.key==='Enter')
            searchMovie()
          "
        >

        <button
          onclick="searchMovie()"
        >
          検索
        </button>

      </div>

      <div id="searchResults"></div>

    </div>


    <h2 class="section-title">
      マイ映画棚
    </h2>


    <div class="shelf-tabs">

      <button
        id="tabAll"
        class="shelf-tab active"
        onclick="
          changeShelfTab('all')
        "
      >
        すべて
      </button>

      <button
        id="tabUnwatched"
        class="shelf-tab"
        onclick="
          changeShelfTab('unwatched')
        "
      >
        未視聴
      </button>

      <button
        id="tabWatched"
        class="shelf-tab"
        onclick="
          changeShelfTab('watched')
        "
      >
        視聴済み
      </button>

    </div>


    <div
      id="shelfCount"
      class="shelf-count"
    ></div>


    <input
      id="listSearch"
      class="list-search"
      placeholder="登録作品を検索"
      oninput="
        renderMovieList()
      "
    >


    <div id="movieList"></div>


    <div class="tmdb-credit">
      Movie data provided by TMDB.
    </div>

  `;

  updateShelfTabs();

  renderMovieList();

}


/* ADD BUTTON */

function focusSearch(){

  if(
    !document.getElementById(
      "movieSearch"
    )
  ){

    showHome();

  }

  setTimeout(()=>{

    const input =
      document.getElementById(
        "movieSearch"
      );

    if(!input) return;

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  },100);

}


/* SHELF TAB */

function changeShelfTab(tab){

  currentShelfTab =
    tab;

  updateShelfTabs();

  renderMovieList();

}

function updateShelfTabs(){

  const all =
    document.getElementById(
      "tabAll"
    );

  const unwatched =
    document.getElementById(
      "tabUnwatched"
    );

  const watched =
    document.getElementById(
      "tabWatched"
    );

  if(!all) return;

  all.classList.toggle(
    "active",
    currentShelfTab === "all"
  );

  unwatched.classList.toggle(
    "active",
    currentShelfTab === "unwatched"
  );

  watched.classList.toggle(
    "active",
    currentShelfTab === "watched"
  );

}


/* SEARCH */

async function searchMovie(){

  const input =
    document.getElementById(
      "movieSearch"
    );

  const query =
    input.value.trim();

  if(!query) return;

  currentQuery =
    query;

  currentPage =
    1;

  hasNextPage =
    false;

  const results =
    document.getElementById(
      "searchResults"
    );

  results.innerHTML =
    `<div class="loading">
      🎬 映画を探しています…
    </div>`;

  await loadSearchPage(
    query,
    1,
    false
  );

}


/* SEARCH PAGE */

async function loadSearchPage(
  query,
  page,
  append
){

  if(searching) return;

  searching =
    true;

  const results =
    document.getElementById(
      "searchResults"
    );

  try{

    const response =
      await fetch(
        API_BASE +
        "/search?q=" +
        encodeURIComponent(
          query
        ) +
        "&page=" +
        page
      );

    if(!response.ok){

      throw new Error(
        "API error " +
        response.status
      );

    }

    const data =
      await response.json();

    const found =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

    currentPage =
      data.page || page;

    hasNextPage =
      Boolean(
        data.hasNextPage
      );


    if(
      found.length === 0 &&
      !append
    ){

      results.innerHTML =
        `<div class="empty">
          「${escapeHTML(query)}」に
          該当する映画がありませんでした。
        </div>`;

      searching =
        false;

      return;

    }


    const html =
      found.map(movie => {

        const safeMovie =
          encodeURIComponent(
            JSON.stringify(
              movie
            )
          );

        return `

          <div
            class="result-item"
            onclick="
              confirmAddEncoded(
                '${safeMovie}'
              )
            "
          >

            <img
              src="${poster(
                movie.posterPath
              )}"
            >

            <div>

              <div class="result-title">
                ${escapeHTML(
                  movie.title
                )}
              </div>

              <div class="result-year">

                ${year(
                  movie.releaseDate
                )}

                ${
                  movie.originalTitle
                    ? " / " +
                      escapeHTML(
                        movie.originalTitle
                      )
                    : ""
                }

              </div>

            </div>

          </div>

        `;

      }).join("");


    if(!append){

      results.innerHTML = `

        <h3>
          検索結果
        </h3>

        <div
          id="searchMovieResults"
        >
          ${html}
        </div>

      `;

    }else{

      const list =
        document.getElementById(
          "searchMovieResults"
        );

      if(list){

        list.insertAdjacentHTML(
          "beforeend",
          html
        );

      }

    }


    const oldButton =
      document.getElementById(
        "loadMoreButton"
      );

    if(oldButton){

      oldButton.remove();

    }


    if(hasNextPage){

      results.insertAdjacentHTML(
        "beforeend",

        `

        <button
          id="loadMoreButton"
          class="load-more"
          onclick="loadNextPage()"
        >
          次の20作品を表示
        </button>

        `

      );

    }

  }catch(error){

    console.error(
      error
    );

    results.innerHTML = `

      <div class="error">

        検索に失敗しました。<br>

        もう一度検索してください。

      </div>

    `;

  }

  searching =
    false;

}


/* NEXT 20 */

async function loadNextPage(){

  const button =
    document.getElementById(
      "loadMoreButton"
    );

  if(button){

    button.disabled =
      true;

    button.textContent =
      "読み込み中…";

  }

  await loadSearchPage(
    currentQuery,
    currentPage + 1,
    true
  );

}


/* ADD */

function confirmAddEncoded(
  encoded
){

  try{

    const movie =
      JSON.parse(
        decodeURIComponent(
          encoded
        )
      );

    confirmAdd(
      movie
    );

  }catch(error){

    console.error(
      error
    );

    alert(
      "作品情報の読み込みに失敗しました。"
    );

  }

}


function confirmAdd(movie){

  const duplicate =
    movies.find(
      m =>
        m.tmdbId ===
        movie.id
    );

  if(duplicate){

    const answer =
      confirm(

        "「" +
        movie.title +
        "」はすでに登録されています。\n\n" +
        "それでも追加しますか？"

      );

    if(!answer) return;

  }

  addMovie(
    movie
  );

}


function addMovie(movie){

  movies.push({

    localId:
      Date.now().toString(),

    tmdbId:
      movie.id,

    title:
      movie.title ||
      "",

    originalTitle:
      movie.originalTitle ||
      "",

    releaseDate:
      movie.releaseDate ||
      "",

    overview:
      movie.overview ||
      "",

    posterPath:
      movie.posterPath ||
      "",

    watched:
      false,

    rating:
      0,

    note:
      "",

    createdAt:
      new Date()
        .toISOString()

  });

  saveMovies();

  alert(
    "「" +
    movie.title +
    "」を映画棚に追加しました！"
  );

  showHome();

}


/* MOVIE LIST */

function renderMovieList(){

  const list =
    document.getElementById(
      "movieList"
    );

  if(!list) return;


  const search =
    (
      document.getElementById(
        "listSearch"
      )?.value ||
      ""
    ).toLowerCase();


  const filtered =
    movies.filter(movie => {

      const matchesSearch =
        movie.title
          .toLowerCase()
          .includes(
            search
          ) ||

        movie.originalTitle
          .toLowerCase()
          .includes(
            search
          );


      if(!matchesSearch){

        return false;

      }


      if(
        currentShelfTab ===
        "watched"
      ){

        return movie.watched ===
          true;

      }


      if(
        currentShelfTab ===
        "unwatched"
      ){

        return movie.watched !==
          true;

      }


      return true;

    });


  /* COUNT */

  const count =
    document.getElementById(
      "shelfCount"
    );

  if(count){

    count.textContent =
      `${filtered.length}作品`;

  }


  /* EMPTY */

  if(
    filtered.length ===
    0
  ){

    let message =
      "該当する映画がありません。";


    if(
      currentShelfTab ===
        "all" &&
      movies.length ===
        0
    ){

      message =
        "まだ映画が登録されていません。";

    }


    if(
      currentShelfTab ===
      "watched"
    ){

      message =
        "視聴済みの映画はまだありません。";

    }


    if(
      currentShelfTab ===
      "unwatched"
    ){

      message =
        "未視聴の映画はありません。";

    }


    list.innerHTML =
      `<div class="empty">
        ${message}
      </div>`;

    return;

  }


  /* GRID */

  list.innerHTML = `

    <div class="movie-grid">

      ${filtered.map(movie => `

        <div
          class="movie-card"
          onclick="
            showDetail(
              '${movie.localId}'
            )
          "
        >

          <img
            src="${poster(
              movie.posterPath
            )}"
          >

          <div class="movie-info">

            <div class="movie-title">
              ${escapeHTML(
                movie.title
              )}
            </div>

            <div class="movie-year">
              ${year(
                movie.releaseDate
              )}
            </div>

            <span
              class="status ${
                movie.watched
                  ? "watched"
                  : "unwatched"
              }"
            >
              ${
                movie.watched
                  ? "✓ 視聴済み"
                  : "未視聴"
              }
            </span>

          </div>

        </div>

      `).join("")}

    </div>

  `;

}


/* DETAIL */

function showDetail(
  localId
){

  const movie =
    movies.find(
      m =>
        m.localId ===
        localId
    );

  if(!movie) return;


  window.currentMovieId =
    localId;


  document.getElementById(
    "app"
  ).innerHTML = `

    <button
      class="secondary back"
      onclick="showHome()"
    >
      ← 映画一覧へ戻る
    </button>


    <div class="detail">


      <div class="detail-top">

        <img
          class="detail-poster"
          src="${poster(
            movie.posterPath
          )}"
        >


        <div>

          <div class="detail-title">
            ${escapeHTML(
              movie.title
            )}
          </div>


          <div class="detail-original">
            ${escapeHTML(
              movie.originalTitle
            )}
          </div>


          <div>

            ${
              movie.releaseDate
                ? "公開日：" +
                  escapeHTML(
                    movie.releaseDate
                  )
                : ""
            }

          </div>

        </div>

      </div>


      <div class="detail-section">

        <h3>
          あらすじ
        </h3>


        <div class="detail-overview">

          ${
            movie.overview
              ? escapeHTML(
                  movie.overview
                )
              : "あらすじ情報なし"
          }

        </div>

      </div>


      <div class="detail-section">

        <h3>
          自分の記録
        </h3>


        <div class="field">

          <label>
            視聴状況
          </label>


          <select
            id="watchedSelect"
          >

            <option
              value="false"
              ${
                !movie.watched
                  ? "selected"
                  : ""
              }
            >
              未視聴
            </option>


            <option
              value="true"
              ${
                movie.watched
                  ? "selected"
                  : ""
              }
            >
              視聴済み
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            評価
          </label>


          <div
            id="rating"
            class="rating"
          >

            ${
              [1,2,3,4,5]
                .map(
                  n => `

                    <span
                      class="${
                        n <= movie.rating
                          ? "active"
                          : ""
                      }"
                      onclick="
                        setRating(${n})
                      "
                    >
                      ★
                    </span>

                  `
                )
                .join("")
            }

          </div>

        </div>


        <div class="field">

          <label>
            メモ・感想
          </label>


          <textarea
            id="movieNote"
            placeholder="映画を観た感想などを入力"
          >${escapeHTML(
            movie.note
          )}</textarea>

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick="
              saveDetail(
                '${movie.localId}'
              )
            "
          >
            保存
          </button>


          <button
            class="danger"
            onclick="
              deleteMovie(
                '${movie.localId}'
              )
            "
          >
            この作品を削除
          </button>

        </div>

      </div>

    </div>

  `;

}


/* RATING */

function setRating(
  value
){

  const movie =
    movies.find(
      m =>
        m.localId ===
        window.currentMovieId
    );

  if(!movie) return;


  movie.rating =
    value;


  const rating =
    document.getElementById(
      "rating"
    );

  if(!rating) return;


  rating.innerHTML =
    [1,2,3,4,5]
      .map(
        n => `

          <span
            class="${
              n <= value
                ? "active"
                : ""
            }"
            onclick="
              setRating(${n})
            "
          >
            ★
          </span>

        `
      )
      .join("");

}


/* SAVE */

function saveDetail(
  localId
){

  const movie =
    movies.find(
      m =>
        m.localId ===
        localId
    );

  if(!movie) return;


  movie.watched =
    document.getElementById(
      "watchedSelect"
    ).value ===
    "true";


  movie.note =
    document.getElementById(
      "movieNote"
    ).value;


  saveMovies();


  alert(
    "保存しました！"
  );


  showDetail(
    localId
  );

}


/* DELETE */

function deleteMovie(
  localId
){

  const movie =
    movies.find(
      m =>
        m.localId ===
        localId
    );

  if(!movie) return;


  const answer =
    confirm(

      "「" +
      movie.title +
      "」を削除しますか？\n\n" +
      "この操作は取り消せません。"

    );


  if(!answer) return;


  movies =
    movies.filter(
      m =>
        m.localId !==
        localId
    );


  saveMovies();


  showHome();

}


/* START */

showHome();

</script>
